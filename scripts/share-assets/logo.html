<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "DM Sans";
        font-style: normal;
        font-weight: 400 700;
        src: url("../../app/assets/fonts/dm-sans-latin.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 620px;
        height: 220px;
        overflow: hidden;
        background: #f8f9fb;
      }

      .badge {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 26px;
        width: 100%;
        height: 100%;
        padding: 0;
        background: #f8f9fb;
        border: 1px solid #e6e8ec;
        border-radius: 22px;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        color: #101318;
      }

      .mark {
        flex: none;
        width: 104px;
        height: 104px;
        color: #c2410c;
        overflow: visible;
      }

      .ride-body,
      .ride-wheel {
        transform-box: view-box;
      }

      .ride-body {
        transform-origin: 16px 29.5px;
        animation: ride 0.6s ease-in-out infinite;
      }

      .ride-wheel-rear {
        transform-origin: 9px 23px;
      }

      .ride-wheel-front {
        transform-origin: 23px 23px;
      }

      .ride-wheel {
        animation: wheel 0.75s linear infinite;
      }

      @keyframes wheel {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes ride {
        0%,
        100% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        18% {
          transform: translate3d(0, -2.6px, 0) rotate(-2.8deg);
        }
        36% {
          transform: translate3d(0, 0.6px, 0) rotate(1deg);
        }
        56% {
          transform: translate3d(0, -1.8px, 0) rotate(2deg);
        }
        78% {
          transform: translate3d(0, 0.3px, 0) rotate(-0.6deg);
        }
      }

      .wordmark {
        display: flex;
        align-items: baseline;
        font-size: 56px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.035em;
        white-space: nowrap;
      }

      .letter {
        display: inline-block;
        animation: hop 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        animation-delay: calc(-3s + var(--i) * 0.05s);
        will-change: transform;
      }

      .space {
        display: inline-block;
        width: 0.24em;
      }

      @keyframes hop {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        4% {
          transform: translate3d(0, -2px, 0);
        }
        11% {
          transform: translate3d(0, -15px, 0);
        }
        19% {
          transform: translate3d(0, 3px, 0);
        }
        25% {
          transform: translate3d(0, -2px, 0);
        }
        31% {
          transform: translate3d(0, 0, 0);
        }
      }
    </style>
  </head>
  <body>
    <div class="badge">
      <svg class="mark" viewBox="0 2.5 32 32" fill="none" aria-hidden="true">
        <g class="ride-body">
          <g class="ride-wheel ride-wheel-rear">
            <circle cx="9" cy="23" r="5.5" stroke="currentColor" stroke-width="2" />
            <line x1="9" y1="18.6" x2="9" y2="27.4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
            <line x1="5.19" y1="20.8" x2="12.81" y2="25.2" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
            <line x1="5.19" y1="25.2" x2="12.81" y2="20.8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
            <circle cx="9" cy="23" r="1.15" fill="currentColor" />
          </g>
          <g class="ride-wheel ride-wheel-front">
            <circle cx="23" cy="23" r="5.5" stroke="currentColor" stroke-width="2" />
            <line x1="23" y1="18.6" x2="23" y2="27.4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
            <line x1="19.19" y1="20.8" x2="26.81" y2="25.2" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
            <line x1="19.19" y1="25.2" x2="26.81" y2="20.8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
            <circle cx="23" cy="23" r="1.15" fill="currentColor" />
          </g>
          <path
            d="M9 23l5-8h7l2 8M14 15c-1.5-3 0-6.5 3.5-6.5 2 0 3 1 3.5 2.5l8 1.5c-1.32 2.56-5.24 3.5-8 2.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
      </svg>
      <div class="wordmark" id="wordmark" aria-label="Pelican Arena"></div>
    </div>
    <script>
      const word = "Pelican Arena";
      const host = document.getElementById("wordmark");
      let i = 0;
      for (const ch of word) {
        if (ch === " ") {
          host.insertAdjacentHTML("beforeend", '<span class="space"></span>');
          continue;
        }
        const span = document.createElement("span");
        span.className = "letter";
        span.style.setProperty("--i", String(i));
        span.textContent = ch;
        host.append(span);
        i += 1;
      }
    </script>
  </body>
</html>
