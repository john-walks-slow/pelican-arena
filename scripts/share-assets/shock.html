<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "DM Sans";
        font-style: normal;
        font-weight: 400 700;
        src: url("../../app/assets/fonts/dm-sans-latin.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 380px;
        height: 250px;
        overflow: hidden;
        background: #f8f9fb;
      }

      .card {
        position: relative;
        width: 100%;
        height: 100%;
        background: #f8f9fb;
        border: 1px solid #e6e8ec;
        border-radius: 22px;
        overflow: hidden;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      }

      .ground {
        position: absolute;
        left: 54px;
        right: 54px;
        top: 188px;
        height: 2px;
        border-radius: 2px;
        background: #e6e8ec;
      }

      .scene {
        position: absolute;
        left: 50%;
        top: 62px;
        width: 132px;
        height: 132px;
        transform: translateX(-50%);
        transform-origin: 50% 92%;
        color: #c2410c;
        animation: crash 3s cubic-bezier(0.3, 0, 0.2, 1) infinite;
      }

      .ride-body,
      .ride-wheel {
        transform-box: view-box;
      }

      .ride-body {
        transform-origin: 16px 29.5px;
        animation: ride 0.6s ease-in-out infinite;
      }

      .ride-wheel-rear {
        transform-origin: 9px 23px;
      }

      .ride-wheel-front {
        transform-origin: 23px 23px;
      }

      .ride-wheel {
        animation: wheel 0.7s linear infinite;
      }

      @keyframes wheel {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes ride {
        0%,
        100% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        18% {
          transform: translate3d(0, -2.6px, 0) rotate(-2.8deg);
        }
        36% {
          transform: translate3d(0, 0.6px, 0) rotate(1deg);
        }
        56% {
          transform: translate3d(0, -1.8px, 0) rotate(2deg);
        }
        78% {
          transform: translate3d(0, 0.3px, 0) rotate(-0.6deg);
        }
      }

      @keyframes crash {
        0%,
        17% {
          transform: translateX(-50%) translate3d(0, 0, 0) rotate(0deg);
        }
        21% {
          transform: translateX(-50%) translate3d(0, -12px, 0) rotate(-3deg);
        }
        25% {
          transform: translateX(-50%) translate3d(6px, -4px, 0) rotate(8deg);
        }
        33% {
          transform: translateX(-50%) translate3d(22px, 18px, 0) rotate(84deg);
        }
        37% {
          transform: translateX(-50%) translate3d(22px, 10px, 0) rotate(74deg);
        }
        41% {
          transform: translateX(-50%) translate3d(22px, 18px, 0) rotate(81deg);
        }
        45%,
        82% {
          transform: translateX(-50%) translate3d(22px, 18px, 0) rotate(79deg);
        }
        92%,
        100% {
          transform: translateX(-50%) translate3d(0, 0, 0) rotate(0deg);
        }
      }

      .bang {
        position: absolute;
        left: 50%;
        top: 28px;
        display: flex;
        gap: 9px;
        transform: translateX(-50%);
        font-size: 34px;
        font-weight: 700;
        line-height: 1;
        color: #c2410c;
      }

      .bang span {
        display: block;
        opacity: 0;
        animation: bang 3s ease-out infinite;
      }

      .bang span:nth-child(2) {
        animation-delay: 0.06s;
      }

      .bang span:nth-child(3) {
        animation-delay: 0.12s;
      }

      @keyframes bang {
        0%,
        24% {
          opacity: 0;
          transform: translateY(8px) scale(0.6);
        }
        29% {
          opacity: 1;
          transform: translateY(-2px) scale(1.08);
        }
        34%,
        78% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        88%,
        100% {
          opacity: 0;
          transform: translateY(0) scale(1);
        }
      }

      .dust {
        position: absolute;
        left: 50%;
        top: 184px;
        width: 150px;
        height: 20px;
        transform: translateX(-32%);
        stroke: #c2410c;
        stroke-width: 2;
        stroke-linecap: round;
        opacity: 0;
        animation: dust 3s ease-out infinite;
      }

      @keyframes dust {
        0%,
        28% {
          opacity: 0;
          transform: translateX(-32%) scaleX(0.4);
        }
        34% {
          opacity: 0.8;
          transform: translateX(-32%) scaleX(1);
        }
        46%,
        78% {
          opacity: 0.45;
          transform: translateX(-32%) scaleX(1.15);
        }
        88%,
        100% {
          opacity: 0;
          transform: translateX(-32%) scaleX(1.2);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="ground"></div>
      <div class="bang" aria-hidden="true"><span>!</span><span>!</span><span>!</span></div>
      <div class="scene">
        <svg viewBox="0 2.5 32 32" fill="none" aria-hidden="true">
          <g class="ride-body">
            <g class="ride-wheel ride-wheel-rear">
              <circle cx="9" cy="23" r="5.5" stroke="currentColor" stroke-width="2" />
              <line x1="9" y1="18.6" x2="9" y2="27.4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
              <line x1="5.19" y1="20.8" x2="12.81" y2="25.2" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
              <line x1="5.19" y1="25.2" x2="12.81" y2="20.8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
              <circle cx="9" cy="23" r="1.15" fill="currentColor" />
            </g>
            <g class="ride-wheel ride-wheel-front">
              <circle cx="23" cy="23" r="5.5" stroke="currentColor" stroke-width="2" />
              <line x1="23" y1="18.6" x2="23" y2="27.4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
              <line x1="19.19" y1="20.8" x2="26.81" y2="25.2" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
              <line x1="19.19" y1="25.2" x2="26.81" y2="20.8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
              <circle cx="23" cy="23" r="1.15" fill="currentColor" />
            </g>
            <path
              d="M9 23l5-8h7l2 8M14 15c-1.5-3 0-6.5 3.5-6.5 2 0 3 1 3.5 2.5l8 1.5c-1.5 2-5 2.9-8 2.5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </g>
        </svg>
      </div>
      <svg class="dust" viewBox="0 0 150 20" fill="none" aria-hidden="true">
        <line x1="10" y1="12" x2="34" y2="12" />
        <line x1="2" y1="18" x2="26" y2="18" />
        <line x1="116" y1="12" x2="140" y2="12" />
        <line x1="126" y1="18" x2="148" y2="18" />
      </svg>
    </div>
  </body>
</html>
